<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FAF9F5]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — TalentHub Consultant</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="stylesheet" href="/assets/css/admin-tailwind.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-6 text-slate-800">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-8 text-center">
    <div class="w-16 h-16 bg-emerald-50 rounded-2xl flex items-center justify-center mx-auto mb-5 border border-emerald-100 text-[#1D6A34]">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 00-9.78 2.096A4.001 4.001 0 003 15z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4l16 16" />
      </svg>
    </div>

    <h1 class="text-2xl font-bold text-slate-900 mb-2">Connection Offline</h1>
    <p class="text-sm text-slate-600 mb-6 leading-relaxed">
      You are currently offline or your network connection was interrupted. Please verify your internet connection and try again.
    </p>

    <div class="space-y-3">
      <button onclick="window.location.reload()" class="w-full inline-flex items-center justify-center px-5 py-3 rounded-xl bg-[#1D6A34] text-white font-medium hover:bg-[#155227] transition-colors shadow-sm">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Retry Connection
      </button>

      <a href="/admin" class="w-full inline-flex items-center justify-center px-5 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-sm font-medium hover:bg-slate-50 transition-colors">
        Go to Admin Portal
      </a>
    </div>

    <div class="mt-8 pt-6 border-t border-slate-100 text-xs text-slate-500">
      Need urgent support? Reach our Pune office:<br>
      <a href="tel:+917276146573" class="text-[#1D6A34] font-semibold hover:underline">+91 72761 46573</a> &bull;
      <a href="mailto:hr@talenthubconsultant.com" class="text-[#1D6A34] font-semibold hover:underline">hr@talenthubconsultant.com</a>
    </div>
  </div>
</body>
</html>
