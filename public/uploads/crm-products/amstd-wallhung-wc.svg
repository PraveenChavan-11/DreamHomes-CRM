<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#EDF2F7"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#CBD5E1"/>
      <stop offset="65%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="artGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Architectural Grid Pattern -->
  <g opacity="0.15" stroke="#64748B" stroke-width="0.5" stroke-dasharray="4,4">
    <line x1="40" y1="0" x2="40" y2="450"/>
    <line x1="120" y1="0" x2="120" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="280" y1="0" x2="280" y2="450"/>
    <line x1="360" y1="0" x2="360" y2="450"/>
    <line x1="440" y1="0" x2="440" y2="450"/>
    <line x1="520" y1="0" x2="520" y2="450"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="380" x2="600" y2="380"/>
  </g>

  <!-- Product Stage Plinth -->
  <ellipse cx="300" cy="355" rx="210" ry="24" fill="#000000" opacity="0.07"/>
  <ellipse cx="300" cy="352" rx="160" ry="16" fill="#000000" opacity="0.10"/>

  <!-- Product Art Element -->
  <g filter="url(#artGlow)">
            <!-- Wall Outline -->
        <line x1="160" y1="70" x2="160" y2="340" stroke="#94A3B8" stroke-width="6"/>
        <!-- Dual Flush Actuator Plate -->
        <rect x="180" y="100" width="70" height="45" rx="4" fill="url(#chromeGrad)"/>
        <circle cx="205" cy="122" r="12" fill="#FFFFFF"/>
        <circle cx="232" cy="122" r="8" fill="#FFFFFF"/>
        <!-- Wall Hung Vitreous China Toilet Pan -->
        <path d="M 160 180 C 230 180, 360 190, 390 240 C 400 260, 390 280, 360 290 C 310 305, 230 300, 160 270 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
        <!-- Ultra-Slim Soft Close Seat Cover -->
        <path d="M 160 176 C 240 176, 370 186, 392 235" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Brand Badge Top Right -->
  <g transform="translate(420, 24)">
    <rect width="156" height="34" rx="17" fill="#1E40AF" opacity="0.95"/>
    <text x="78" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">AMERICAN STANDARD</text>
  </g>

  <!-- Category Tag Top Left -->
  <g transform="translate(24, 24)">
    <rect width="130" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="65" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">Sanitaryware</text>
  </g>

  <!-- Bottom Title Card -->
  <g transform="translate(24, 385)">
    <rect width="552" height="48" rx="8" fill="#FFFFFF" opacity="0.92" stroke="#E2E8F0" stroke-width="1"/>
    <text x="18" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Wall-Hung Rimless Smart Ceramic WC</text>
    <text x="534" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#1D6A34" text-anchor="end">DHIS AUTHENTIC</text>
  </g>
</svg>