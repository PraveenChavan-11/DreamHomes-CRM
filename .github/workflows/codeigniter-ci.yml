name: CodeIgniter 4 CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
      - 'feature/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeigniter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-secrets:
    name: 1. Security & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Secrets or Environment Files Tracked
        run: |
          echo "Scanning git repository for committed secrets..."
          tracked="$(git ls-files | grep -iE '(^|/)serviceAccountKey[^/]*\.json$|\.pem$|\.key$|\.env$' | grep -vE '\.(example|sample|template|staging)$' || true)"
          if [ -n "$tracked" ]; then
            echo "SECURITY ERROR: Sensitive credential files found in repository:"
            echo "$tracked"
            exit 1
          fi
          echo "Secret check passed: 0 secret files tracked."

  codeigniter-quality-and-tests:
    name: 2. CodeIgniter 4 Backend Verification
    runs-on: ubuntu-latest
    needs: security-and-secrets
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo, pdo_mysql, mbstring, intl, json, curl, xml, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Setup CodeIgniter Writable Storage & Permissions
        run: |
          mkdir -p writable/cache writable/logs writable/session writable/debugbar writable/uploads writable/vault/resumes public/uploads
          chmod -R 775 writable

      - name: Lint PHP Syntax Across All App & Public Files
        run: |
          echo "Linting all PHP files in app/ and public/..."
          find app public -type f -name "*.php" -exec php -l {} +

      - name: Verify CodeIgniter Boot Engine & Routes
        run: |
          php spark --version
          php spark routes

      - name: Run CodeIgniter System Health Diagnostic
        run: |
          php spark system:check || true

      - name: Verify Production Deployment Files
        run: |
          for f in public/index.php public/.htaccess index.php .htaccess spark app/Config/App.php app/Config/Database.php app/Config/Paths.php; do
            test -s "$f" || { echo "Missing critical CodeIgniter file: $f"; exit 1; }
          done
          echo "All CodeIgniter 4 deployment files verified successfully."
