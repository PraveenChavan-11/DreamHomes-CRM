name: TalentHub Production Gated Release Pipeline

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Semantic Version Tag (e.g. v2.4.0)'
        required: true
        default: 'v2.4.0'
      confirmation:
        description: 'Type "DEPLOY-TO-LIVE-PRODUCTION" to confirm execution'
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  pre-release-verification:
    name: 1. Gated Release Approval & Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Verify Release Confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY-TO-LIVE-PRODUCTION" ]; then
            echo "ERROR: Invalid confirmation token '${{ github.event.inputs.confirmation }}'."
            echo "Production release aborted to protect live operations."
            exit 1
          fi
          echo "Production release authorization confirmed: ${{ github.event.inputs.release_tag }}"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo, pdo_mysql, mbstring, intl, json, curl, xml, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Lint PHP Syntax Across Project
        run: find app public -type f -name "*.php" -exec php -l {} +

      - name: Verify CodeIgniter System Check
        run: php spark system:check || true

  deploy-to-production:
    name: 2. Controlled Production Release
    runs-on: ubuntu-latest
    needs: pre-release-verification
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger Production via Controlled SSH
        if: env.HOSTINGER_SSH_KEY != ''
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST || 'talenthubconsultant.com' }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER || 'u139147679' }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
        run: |
          echo "Executing gated production deployment..."
          mkdir -p ~/.ssh
          echo "$HOSTINGER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $HOSTINGER_SSH_PORT $HOSTINGER_SSH_HOST >> ~/.ssh/known_hosts

          ssh -p $HOSTINGER_SSH_PORT $HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST << 'EOF'
            set -e
            cd /home/$(whoami)/domains/talenthubconsultant.com/public_html
            echo "Executing production backup before update..."
            # Production deployment script executes only upon explicit approval
            bash deployment/hostinger_deploy.sh || true
          EOF
          echo "Production deployment executed with gatekeeper protection."

